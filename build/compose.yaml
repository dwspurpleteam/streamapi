name: callrelay

services:
  openvidu:
    image: openvidu/openvidu-server:3.9.0@sha256:21a234c29f35ecc8f7c7c804059167242433c1266ff63f23c60e92848ace072e
    environment:
      LIVEKIT_CONFIG: |
        keys:
          callrelay-dev: callrelay-development-secret-00000000
        rtc:
          use_external_ip: false
          tcp_port: 7881
          udp_port: 7882
        webhook:
          api_key: callrelay-dev
          urls:
            - http://host.docker.internal:19080/webhooks/livekit
    ports:
    - 127.0.0.1:17880:7880
    - 127.0.0.1:7881:7881
    - 127.0.0.1:7882:7882/udp
    extra_hosts:
    - host.docker.internal:host-gateway
    mem_limit: 768m
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:7880/]
      interval: 2s
      timeout: 1s
      retries: 15

  nats:
    image: nats:2.15.1-alpine
    command: --config /etc/nats/nats.conf
    ports:
    - 127.0.0.1:14222:4222
    volumes:
    - nats:/data
    configs:
    - source: nats
      target: /etc/nats/nats.conf
    mem_limit: 128m
    healthcheck:
      test: wget -qO- http://127.0.0.1:8222/healthz?js-enabled-only=true
      interval: 2s
      timeout: 1s
      retries: 15

volumes:
  nats: {}

configs:
  nats:
    content: |
      port: 4222
      http: 127.0.0.1:8222
      authorization {
        user: callrelay
        password: callrelay-dev
      }
      jetstream {
        store_dir: /data
        max_memory_store: 8388608
        max_file_store: 67108864
      }
