syntax = "proto3";

package streamapi.v1;

option go_package = "github.com/dwspurpleteam/streamapi/internal/pkg/gen/streamapi/v1;streamapiv1";

service ActionService {
  rpc MuteMicrophone(MuteMicrophoneRequest) returns (MuteMicrophoneResponse);
}

message MuteMicrophoneRequest {
  string call_id = 1;
  string activation_id = 2;
  string participant_id = 3;
}

message MuteMicrophoneResponse {}
